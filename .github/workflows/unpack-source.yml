name: Expand MeetMart source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-000.b64 .bootstrap/part-001.b64 .bootstrap/part-002.b64 > /tmp/meetmart-source.b64
          head -c 12000 .bootstrap/part-003.b64 >> /tmp/meetmart-source.b64
          cat .bootstrap/part-004.b64 .bootstrap/part-005.b64 .bootstrap/part-006.b64 .bootstrap/part-007.b64 .bootstrap/part-008.b64 .bootstrap/part-009.b64 >> /tmp/meetmart-source.b64
          base64 --decode /tmp/meetmart-source.b64 > /tmp/meetmart-source.tar.gz
          tar -xzf /tmp/meetmart-source.tar.gz -C .
          rm -rf .bootstrap
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source expansion changes to commit."
            exit 0
          fi
          git commit -m "Expand MeetMart NG production source"
          git push
