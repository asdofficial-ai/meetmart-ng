name: MeetMart 75 percent beta milestone

on:
  push:
    paths:
      - '.github/workflows/beta75-once.yml'

permissions:
  contents: write

jobs:
  beta75:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 75 percent beta patch
        run: python3 scripts/beta75_patch.py
      - name: Install dependencies
        run: npm install
      - name: Backend syntax checks
        run: npm run check
      - name: API regression tests
        run: npm run api:test
      - name: Production frontend build
        run: npm run build
      - name: Commit tested milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/beta75-once.yml scripts/beta75_patch.py
          git add server/db.js server/index.js server/tests/smoke.mjs src/services/api.js src/App.jsx src/styles.css MILESTONE_75.md
          git commit -m "Reach MeetMart 75 percent beta milestone"
          git push
